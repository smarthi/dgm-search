[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-search"
version = "0.1.0"
description = "Does a stability gate make Darwin-Godel-style self-improvement of retrieval pipelines generalize better than score-only selection?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suneel Marthi" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
dgmsearch = "dgmsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgmsearch = ["seed/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
